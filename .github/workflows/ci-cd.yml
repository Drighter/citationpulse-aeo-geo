name: CI/CD — Build, Test & Deploy to Firebase

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & E2E API Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Root, Backend & Frontend Dependencies
        run: |
          npm install
          npm install --prefix backend
          npm install --prefix frontend

      - name: Run Backend End-to-End Test Suite (SEO/AEO/GEO Scanner & Developer API)
        run: npm run test

      - name: Build Backend TypeScript
        run: npm run build --prefix backend

      - name: Build Frontend Production Bundle
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: citationpulse-aeo-geo.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: citationpulse-aeo-geo
          VITE_FIREBASE_STORAGE_BUCKET: citationpulse-aeo-geo.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '972205468745'
          VITE_FIREBASE_APP_ID: '1:972205468745:web:da960b2a1d940b8939a398'
        run: npm run build --prefix frontend

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  deploy-firebase:
    name: Publish to Firebase Hosting
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CITATIONPULSE_AEO_GEO }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Deploy to Firebase Hosting (Live Channel)
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CITATIONPULSE_AEO_GEO }}
          channelId: live
          projectId: citationpulse-aeo-geo
